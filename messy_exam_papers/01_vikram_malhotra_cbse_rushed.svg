          </text>
          
        </g>
      
        <g transform="rotate(-2.373338472298013, 100, 224)">
          <text x="100" y="225.6405514667888" font-family="'Kalam', cursive" font-size="16" font-weight="500" fill="#1e40af" letter-spacing="0.3">
            
          </text>
          
        </g>
      
        <g transform="rotate(-2.220921895297444, 100, 258)">
          <text x="100" y="255.8138797920064" font-family="'Kalam', cursive" font-size="18" font-weight="700" fill="#1e40af" letter-spacing="0.3">
            Q1: Ohm&apos;s Law and Resistance of a Conductor
          </text>
          
        </g>
      
        <g transform="rotate(-2.6580960958129363, 100, 292)">
          <text x="100" y="293.27256748165405" font-family="'Kalam', cursive" font-size="16" font-weight="500" fill="#1e40af" letter-spacing="0.3">
            Ohm&apos;s Law: At constant temp, current I is proportional to Voltage V (V = I * R).
          </text>
          
        </g>
      
        <g transform="rotate(-3.354016354635882, 100, 326)">
          <text x="100" y="326.49035781102054" font-family="'Kalam', cursive" font-size="16" font-weight="500" fill="#1e40af" letter-spacing="0.3">
            Factors affecting resistance:
          </text>
          
        </g>
      
        <g transform="rotate(-3.7820240941320775, 100, 360)">
          <text x="100" y="358.0740052156855" font-family="'Kalam', cursive" font-size="16" font-weight="500" fill="#1e40af" letter-spacing="0.3">
            1. Length: Resistance increases with length of wire (R ∝ L).
          </text>
          
        </g>
      
        <g transform="rotate(-3.6182115900447895, 100, 394)">
          <text x="100" y="396.07613047277704" font-family="'Kalam', cursive" font-size="16" font-weight="500" fill="#1e40af" letter-spacing="0.3">
            2. Area of cross section: R ∝ A
          </text>
          
        <g opacity="0.9">
          <!-- Heavy wavy scratch lines -->
          <path d="M 317 392.07613047277704 
                   Q 332.875 387.07613047277704, 344.75 393.07613047277704 
                   T 374.5 390.07613047277704" 
                stroke="#1e40af" stroke-width="2.6" stroke-linecap="round" fill="none"/>
          <path d="M 372.5 395.07613047277704 
                   Q 349.5 401.07613047277704, 319 398.07613047277704" 
                stroke="#1e40af" stroke-width="2.4" stroke-linecap="round" fill="none"/>
          <path d="M 321 394.07613047277704 L 368.5 394.07613047277704" 
                stroke="#1e40af" stroke-width="2.8" stroke-linecap="round" fill="none"/>
        </g>
      
        </g>
      
        <g transform="rotate(-2.98654887961252, 120, 428)">
          <path d="M 105 425.1594428821952 L 112 415.1594428821952 L 119 425.1594428821952" stroke="#1e40af" stroke-width="2" fill="none" stroke-linecap="round"/>
          <text x="120" y="417.1594428821952" font-family="'Kalam', cursive" font-size="14.5" font-weight="500" fill="#1e40af" letter-spacing="0.3">
               ^ R ∝ 1/A (thick wire has LESS resistance, thin wire has more)
          </text>
        </g>
      
        <g transform="rotate(-2.3650657089206772, 100, 462)">
          <text x="100" y="461.0439556314418" font-family="'Kalam', cursive" font-size="16" font-weight="500" fill="#1e40af" letter-spacing="0.3">
            3. Formula: R = rho * (A / L)
          </text>
          
        <g opacity="0.9">
          <!-- Heavy wavy scratch lines -->
          <path d="M 198 457.0439556314418 
                   Q 242.375 452.0439556314418, 282.75 458.0439556314418 
                   T 369.5 455.0439556314418" 
                stroke="#1e40af" stroke-width="2.6" stroke-linecap="round" fill="none"/>
          <path d="M 367.5 460.0439556314418 
                   Q 298.9 466.0439556314418, 200 463.0439556314418" 
                stroke="#1e40af" stroke-width="2.4" stroke-linecap="round" fill="none"/>
          <path d="M 202 459.0439556314418 L 363.5 459.0439556314418" 
                stroke="#1e40af" stroke-width="2.8" stroke-linecap="round" fill="none"/>
        </g>
      
        </g>
      
        <g transform="rotate(-2.224088151323931, 120, 496)">
          <path d="M 105 496.11453599390467 L 112 486.11453599390467 L 119 496.11453599390467" stroke="#1e40af" stroke-width="2" fill="none" stroke-linecap="round"/>
          <text x="120" y="488.11453599390467" font-family="'Kalam', cursive" font-size="14.5" font-weight="500" fill="#1e40af" letter-spacing="0.3">
               ^ R = ρ * (L / A) where ρ = resistivity of material.
          </text>
        </g>
      
        <g transform="rotate(-2.670305211806595, 100, 530)">
          <text x="100" y="528.1383151108146" font-family="'Kalam', cursive" font-size="16" font-weight="500" fill="#1e40af" letter-spacing="0.3">
            4. Temperature: R increases with rise in temperature for metals.
          </text>
          
        </g>
      
        <g transform="rotate(-3.3660287150202572, 100, 564)">
          <text x="100" y="564.3662560077818" font-family="'Kalam', cursive" font-size="16" font-weight="500" fill="#1e40af" letter-spacing="0.3">
            
          </text>
          
        </g>
      
        <g transform="rotate(-3.784748984053193, 100, 598)">
          <text x="100" y="599.373629697916" font-family="'Kalam', cursive" font-size="18" font-weight="700" fill="#1e40af" letter-spacing="0.3">
            Q2: Rusting of Iron (Corrosion)
          </text>
          
        </g>
      
        <g transform="rotate(-3.6095868671352256, 100, 632)">
          <text x="100" y="629.8033109325396" font-family="'Kalam', cursive" font-size="16" font-weight="500" fill="#1e40af" letter-spacing="0.3">
            Rusting is slow chemical reaction forming reddish brown powder.
          </text>
          
        </g>
      
        <g transform="rotate(-2.9731015622230905, 100, 666)">
          <text x="100" y="667.5535728057968" font-family="'Kalam', cursive" font-size="16" font-weight="500" fill="#1e40af" letter-spacing="0.3">
            Rusting happens in dry air alone
          </text>
          
        <g opacity="0.9">
          <!-- Heavy wavy scratch lines -->
          <path d="M 96 663.5535728057968 
                   Q 176 658.5535728057968, 252 664.5535728057968 
                   T 410 661.5535728057968" 
                stroke="#1e40af" stroke-width="2.6" stroke-linecap="round" fill="none"/>
          <path d="M 408 666.5535728057968 
                   Q 282.4 672.5535728057968, 98 669.5535728057968" 
                stroke="#1e40af" stroke-width="2.4" stroke-linecap="round" fill="none"/>
          <path d="M 100 665.5535728057968 L 404 665.5535728057968" 
                stroke="#1e40af" stroke-width="2.8" stroke-linecap="round" fill="none"/>
        </g>
      
        </g>
      
        <g transform="rotate(-2.3569724587587033, 120, 700)">
          <path d="M 105 698.1264724518309 L 112 688.1264724518309 L 119 698.1264724518309" stroke="#1e40af" stroke-width="2" fill="none" stroke-linecap="round"/>
          <text x="120" y="690.1264724518309" font-family="'Kalam', cursive" font-size="14.5" font-weight="500" fill="#1e40af" letter-spacing="0.3">
               ^ Rusting requires BOTH Oxygen (O2) and Water/moisture (H2O)!
          </text>
        </g>
      
        <g transform="rotate(-2.227473778760578, 100, 734)">
          <text x="100" y="732.2778960701886" font-family="'Kalam', cursive" font-size="16" font-weight="500" fill="#1e40af" letter-spacing="0.3">
            Chemical Reaction:
          </text>
          
        </g>
      
        <g transform="rotate(-2.68260754149551, 100, 768)">
          <text x="100" y="770.1683206573393" font-family="'Kalam', cursive" font-size="16" font-weight="500" fill="#1e40af" letter-spacing="0.3">
            4Fe(s) + 3O2(g) + 2xH2O(l) -&gt; 2Fe2O3.xH2O (Hydrated ferric oxide / rust)
          </text>
          
        </g>
      
        <g transform="rotate(-3.377937589118773, 100, 802)">
          <text x="100" y="800.8327038089495" font-family="'Kalam', cursive" font-size="16" font-weight="500" fill="#1e40af" letter-spacing="0.3">
            Prevention:
          </text>
          
        </g>
      
        <g transform="rotate(-3.787252004065315, 100, 836)">
          <text x="100" y="835.387162266317" font-family="'Kalam', cursive" font-size="16" font-weight="500" fill="#1e40af" letter-spacing="0.3">
            1. Galvanisation: Coating zinc layer on iron sheets.
          </text>
          
        </g>
      
        <g transform="rotate(-3.600789797417341, 100, 870)">
          <text x="100" y="871.9839343648274" font-family="'Kalam', cursive" font-size="16" font-weight="500" fill="#1e40af" letter-spacing="0.3">
            2. Painting: Applying oil paint to stop contact with air &amp; rain.
          </text>
          
        </g>
      
        <g transform="rotate(-2.959661849754548, 100, 904)">
          <text x="100" y="901.969141943528" font-family="'Kalam', cursive" font-size="16" font-weight="500" fill="#1e40af" letter-spacing="0.3">
            
          </text>
          
        </g>
      
        <g transform="rotate(-2.3490610099943154, 100, 938)">
          <text x="100" y="938.7222896864731" font-family="'Kalam', cursive" font-size="18" font-weight="700" fill="#1e40af" letter-spacing="0.3">
            Q3: Neutralization Reaction &amp; Antacids
          </text>
          
        </g>
      
        <g transform="rotate(-2.2310778203983066, 100, 972)">
          <text x="100" y="973.0683694594425" font-family="'Kalam', cursive" font-size="16" font-weight="500" fill="#1e40af" letter-spacing="0.3">
            When acid reacts with base to form salt and water.
          </text>
          
        </g>
      
        <g transform="rotate(-2.6949996066760478, 100, 1006)">
          <text x="100" y="1003.8540524081385" font-family="'Kalam', cursive" font-size="16" font-weight="500" fill="#1e40af" letter-spacing="0.3">
            HCl + NaOH -&gt; NaCl + H2O
          </text>
          
        </g>
      
        <g transform="rotate(-3.389739609968408, 100, 1040)">
          <text x="100" y="1041.7912173873185" font-family="'Kalam', cursive" font-size="16" font-weight="500" fill="#1e40af" letter-spacing="0.3">
            Antacids: Stomach produces excess HCl causing burning pain &amp; acidity.
          </text>
          
        </g>
      
        <g transform="rotate(-3.7895324464965197, 100, 1074)">
          <text x="100" y="1073.7590572037218" font-family="'Kalam', cursive" font-size="16" font-weight="500" fill="#1e40af" letter-spacing="0.3">
            Antacids are mild basic substances like Milk of Magnesia [Mg(OH)2].
          </text>
          
        </g>
      
        <g transform="rotate(-3.591822868062315, 100, 1108)">
          <text x="100" y="1106.5298514280018" font-family="'Kalam', cursive" font-size="16" font-weight="500" fill="#1e40af" letter-spacing="0.3">
